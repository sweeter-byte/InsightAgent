[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-agent"
version = "0.1.0"
description = "A minimal multimodal Research Agent built directly on the OpenAI-compatible Chat Completions API."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["insight_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
