[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-agent"
version = "0.1.0"
description = "A minimal multimodal Research Agent built directly on the OpenAI-compatible Chat Completions API."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.24.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "sentence-transformers>=3.0.0",
    "qdrant-client>=1.12.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.1.1,<4.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "redis>=5.0.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
insight-agent-eval = "evals.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["insight_agent*", "evals*"]

[tool.setuptools.package-data]
evals = ["fixtures/*.json", "policies/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
